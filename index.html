<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こそだてラボ | リンク集</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #f0f8ff 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 50px 20px 30px;
        }
        .header h1 {
            font-size: 26px;
            color: #e91e8c;
            margin-bottom: 12px;
        }
        .header p {
            color: #666;
            font-size: 15px;
            line-height: 1.8;
        }
        .coming-soon {
            background: white;
            border-radius: 20px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            margin: 20px 0;
        }
        .coming-soon .emoji {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .coming-soon h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 12px;
        }
        .coming-soon p {
            font-size: 14px;
            color: #888;
            line-height: 1.8;
        }
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #bbb;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 こそだてラボ</h1>
            <p>子育てをもっと楽しく、もっと豊かに✨<br>
            知育・育児研究・おすすめグッズを発信中♪</p>
        </div>

        <div class="coming-soon">
            <div class="emoji">🛒</div>
            <h2>おすすめグッズリンク 準備中</h2>
            <p>ただいまコンテンツを準備しています。<br>
            もうしばらくお待ちください♪<br><br>
            インスタグラムをフォローして<br>
            最新情報をチェックしてね！</p>
        </div>

        <div class="footer">
            <p>こそだてラボ</p>
        </div>
    </div>
</body>
</html>
